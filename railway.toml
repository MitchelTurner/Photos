# IMPORTANT: In Railway dashboard set Root Directory = "server"
# and use config file /server/railway.toml (Dockerfile build).
#
# This root file is only a pointer — do not deploy with Root Directory = "/".

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
# Only valid if Root Directory is "/"; prefer Root Directory = server instead.
startCommand = "npm run start:prod --prefix server"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
