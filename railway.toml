# Monorepo: point the Railway service Root Directory to /server
# and Config File path to /server/railway.toml (or use the copy below).

[build]
builder = "NIXPACKS"
buildCommand = "cd server && npm ci && npm run build"

[deploy]
startCommand = "cd server && npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
