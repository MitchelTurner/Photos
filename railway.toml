# Deploy from repo root. Root package.json + nixpacks.toml force Node
# (otherwise index.html makes Nixpacks install nginx and npm fails).
# Dashboard: leave Root Directory empty / "/".

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
